<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    #topbar {
      padding: 15px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    #currentTable {
      font-size: 20px;
      font-weight: bold;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }

    #readerContainer {
      max-width: 600px;
      margin: 20px auto;
    }

    #reader {
      width: 100%;
    }

    #message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
    }

    #setupScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #setupBox {
      width: 90%;
      max-width: 450px;
    }

    #tableInput {
      width: 80%;
      font-size: 24px;
      padding: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="setupScreen">
    <div id="setupBox">
      <h1>Scanner Setup</h1>

      <p>Enter the name of this location/table.</p>

      <input
        id="tableInput"
        type="text"
        placeholder="e.g. table1"
      >

      <br>

      <button onclick="setTable()">
        Start Scanner
      </button>
    </div>
  </div>

  <div id="topbar">
    Scanner location:

    <span id="currentTable">
      -
    </span>

    <br>

    <button onclick="changeTable()">
      Change Table
    </button>
  </div>

  <div id="readerContainer">
    <h2>Please scan your QR code</h2>

    <div id="reader"></div>
  </div>

  <div id="message">
    Thank you for coming!
  </div>

  <iframe
    name="googleResponse"
    style="display:none;">
  </iframe>

  <script>
    const APPS_SCRIPT_URL =
      "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    const COOLDOWN_MS = 5000;

    let currentTable = "";
    let scanner = null;
    let scanLocked = false;

    function setTable() {
      const input = document.getElementById("tableInput");
      const name = input.value.trim();

      if (!name) {
        alert("Please enter a table name.");
        return;
      }

      currentTable = name;

      document.getElementById("currentTable").textContent =
        currentTable;

      document.getElementById("setupScreen").style.display =
        "none";

      if (!scanner) {
        startScanner();
      }
    }

    function changeTable() {
      document.getElementById("tableInput").value =
        currentTable;

      document.getElementById("setupScreen").style.display =
        "flex";
    }

    function startScanner() {
      scanner = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      };

      scanner.start(
        {
          facingMode: "environment"
        },
        config,
        onScanSuccess,
        onScanFailure
      ).catch(function(error) {
        console.error(error);

        alert(
          "Could not access the camera. Please allow camera permission and reload the page."
        );
      });
    }

    function onScanSuccess(decodedText) {
      if (scanLocked) {
        return;
      }

      scanLocked = true;

      sendToGoogleSheet(
        decodedText,
        currentTable
      );

      const message =
        document.getElementById("message");

      message.style.display = "flex";

      setTimeout(function() {
        message.style.display = "none";
        scanLocked = false;
      }, COOLDOWN_MS);
    }

    function onScanFailure(error) {
      // Intentionally ignored while scanning.
    }

    function sendToGoogleSheet(qrText, tableName) {
      const form =
        document.createElement("form");

      form.method = "POST";
      form.action = APPS_SCRIPT_URL;
      form.target = "googleResponse";
      form.style.display = "none";

      const qrField =
        document.createElement("input");

      qrField.name = "qr";
      qrField.value = qrText;

      const tableField =
        document.createElement("input");

      tableField.name = "table";
      tableField.value = tableName;

      form.appendChild(qrField);
      form.appendChild(tableField);

      document.body.appendChild(form);

      form.submit();

      setTimeout(function() {
        form.remove();
      }, 1000);
    }
  </script>

</body>

</html>
